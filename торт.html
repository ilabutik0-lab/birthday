<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Birthday Matrix Dad Edition + Music</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            display: block;
        }

        #startBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 24px;
            background: none;
            color: #ffb3c1;
            border: 2px solid #ff3366;
            cursor: pointer;
            text-shadow: 0 0 15px #ff3366;
            box-shadow: 0 0 20px #ff3366;
            z-index: 100;
            transition: 0.3s;
            border-radius: 50px;
        }

        #overlay, #sub-phrase {
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-weight: bold;
            text-align: center;
            text-shadow: 
                0 0 10px #fff,
                0 0 20px #ff3366,
                0 0 40px #ff3366,
                0 0 80px #ff3366;
            filter: blur(0.3px);
            pointer-events: none;
            display: none;
            width: 90%;
            z-index: 50;
            transition: all 1.2s ease-in-out;
        }

        #overlay { top: 40%; font-size: 70px; }
        #sub-phrase { top: 85%; font-size: 30px; font-style: italic; line-height: 1.4; }

        #finalContent {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            z-index: 40;
            width: 100%;
        }

        .profile-circle {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 6px solid #fff;
            box-shadow: 0 0 40px #ff3366;
            object-fit: cover;
            margin-bottom: 20px;
        }

        .balloon {
            position: absolute;
            width: 40px;
            height: 55px;
            background: rgba(255, 51, 102, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 20px #ff3366;
            animation: float 5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(5deg); }
            50% { transform: translateY(-35px) rotate(-5deg); }
        }
    </style>
</head>
<body>

    <!-- Элемент аудио -->
    <audio id="mySong" src="music.mp3" loop></audio>

    <button id="startBtn">ОТКРЫТЬ ПОЗДРАВЛЕНИЕ</button>
    
    <div id="overlay"></div>
    <div id="sub-phrase">Your son, happy dad's day, you are the best dad</div>

    <div id="finalContent">
        <img src="photo.jpg" alt="Best Dad" class="profile-circle">
        <div class="balloon" style="left: 15%; top: 10%;"></div>
        <div class="balloon" style="right: 15%; top: 20%; background: #ff85a1;"></div>
    </div>

    <canvas id="matrix"></canvas>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('startBtn');
        const song = document.getElementById('mySong'); // Ссылка на музыку
        const overlay = document.getElementById('overlay');
        const subPhrase = document.getElementById('sub-phrase');
        const finalContent = document.getElementById('finalContent');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = "21.05.1984HAPPY42+";
        const fontSize = 18;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let i = 0; i < columns; i++) drops[i] = 1;

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.04)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.shadowBlur = 5;
            ctx.shadowColor = "#ff3366";
            ctx.fillStyle = "#ffb3c1"; 
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.985) drops[i] = 0;
                drops[i] += 0.55;
            }
        }

        const timeline = [
            { text: "3", time: 1000 },
            { text: "2", time: 2500 },
            { text: "1", time: 4000 },
            { text: "HAPPY BIRTHDAY", time: 6000 },
            { text: "HAPPY 42+", time: 9000 },
            { text: "21.05.1984", time: 12000 }
        ];

        function startAnimation() {
            btn.style.display = 'none';
            overlay.style.display = 'block';

            // ВКЛЮЧАЕМ МУЗЫКУ
            song.play().catch(error => console.log("Ошибка воспроизведения:", error));

            setInterval(drawMatrix, 50);

            timeline.forEach(item => {
                setTimeout(() => {
                    overlay.innerText = item.text;
                    if (item.text === "HAPPY 42+") {
                        finalContent.style.opacity = "1";
                        subPhrase.style.display = "block";
                        overlay.style.top = "15%";
                    }
                }, item.time);
            });
        }

        btn.addEventListener('click', startAnimation);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
